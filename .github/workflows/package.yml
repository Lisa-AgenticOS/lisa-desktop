# The one gate this repo has: the packages build, their tests pass
# inside makepkg's check(), and the artifacts exist (lisa-os#171 step 1).
# A tag does NOT publish them — see the note above the last step: they
# are a strict subset of the monorepo's lisa-shell (lisa-os ADR-0057),
# so they stay out of the signed [lisa] index. The shell is the only
# thing this repo publishes, and desktop.yml attaches that.
name: package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents:write for the tag-triggered release step; the default
    # token is read-only and gh got HTTP 403 on the first try.
    permissions:
      contents: write
    container:
      image: archlinux:latest
    steps:
      - name: Install build environment
        run: |
          pacman -Syu --noconfirm --needed base-devel git glib2 cmake fcitx5 gjs
          # makepkg refuses to run as root; the checkout is owned by the
          # runner uid, so hand the tree to a build user wholesale.
          useradd -m builder
      - uses: actions/checkout@v5
      - name: Build packages
        run: |
          chown -R builder: .
          # git archive needs the repo to trust the directory it was
          # checked out into by a different uid.
          su builder -c 'git config --global safe.directory "$PWD" && bash build-package.sh out'
      - name: The artifacts exist and carry both packages
        run: |
          ls -l out/
          test -e out/lisa-desktop-*-any.pkg.tar.zst
          test -e out/lisa-desktop-ime-*.pkg.tar.zst
      # #7: these packages install the same paths as the monorepo's
      # lisa-shell and lisa-ime — 51 and 4 of them, measured against the
      # published index — so without a declared conflict pacman decides
      # which surfaces a device runs by install order.
      #
      # Asserted on the ARTIFACT and not on the PKGBUILD, because the
      # question is what pacman will be told. A `conflicts=` inside a
      # package_*() function is one typo away from applying to the wrong
      # split package, and nothing about the build would say so.
      - name: Both packages declare their conflicts (#7)
        run: |
          fail=0
          for pair in lisa-desktop:lisa-shell lisa-desktop-ime:lisa-ime; do
            pkg=${pair%%:*}; want=${pair##*:}
            # -[0-9] anchors the version, so lisa-desktop does not also
            # match lisa-desktop-ime.
            file=$(ls out/"$pkg"-[0-9]*.pkg.tar.zst 2>/dev/null | head -1)
            if [ -z "$file" ]; then
              echo "FAIL: no built package for $pkg — nothing to inspect."
              fail=1; continue
            fi
            # Write to a file and read it back: a `| grep -q` here exits
            # on the first match and SIGPIPEs tar, which under
            # `set -o pipefail` fails the step AFTER the assertion passed.
            tar -xOf "$file" .PKGINFO > /tmp/pkginfo.txt
            if grep -q "^conflict = ${want}\$" /tmp/pkginfo.txt; then
              echo "$pkg declares conflicts=($want): OK"
            else
              echo "FAIL: $pkg does not declare conflicts=($want)."
              echo "      It shares installed paths with $want; without this,"
              echo "      pacman resolves the overlap by install order."
              echo "      --- conflict lines actually in .PKGINFO:"
              grep '^conflict = ' /tmp/pkginfo.txt || echo "      (none)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/*.pkg.tar.zst
          if-no-files-found: error
      # NOT ATTACHED TO THE RELEASE, and this is the deliberate part.
      #
      # These two packages used to be uploaded here on every v* tag, and
      # lisa-packages' publish workflow indexes a whole release ("gh
      # release download --pattern '*.pkg.tar.zst'"), so being a release
      # asset was the same thing as being in the signed [lisa] index
      # every device trusts.
      #
      # They should not be in it. Measured file by file against that
      # index (lisa-os ADR-0057): lisa-desktop is a strict SUBSET of the
      # monorepo's lisa-shell — zero files of its own — and lisa-desktop
      # plus lisa-apps together are 40 files short of it, missing the
      # launcher's gschema (lisa-os#255), the Assistant's D-Bus
      # activation (lisa-os#210) and Preview's manifest at the path
      # agentd actually reads (lisa-os#241). Nothing installs them:
      # /usr/lib/lisa/packages.manifest on the reference device lists
      # lisa-shell, lisa-ime and lisa-desktop-shell. A signed, installable
      # copy of a tree maintained elsewhere, 40 files behind it, is worse
      # than no package — it is a working `pacman -S` away from a broken
      # desktop, and the conflicts= lines added in #7 only decide who
      # wins a collision, not whether the loser should have existed.
      #
      # This is enforced HERE rather than by omitting the source at
      # dispatch time because the index is rebuilt from whole releases:
      # the operator's only lever is repo=tag, and the shell ships from
      # this same tag. Leaving it to whoever fills in the `sources` box
      # is the "guarded by operator memory alone" shape that
      # lisa-packages' own allow_partial guard was written to end.
      #
      # They still build, still run their check(), and still have the
      # conflicts assertion above run against the artifact on every push
      # and PR; the artifacts are attached to the workflow run. What
      # changed is only that a tag no longer publishes them.
      #
      # To start publishing them again — after ADR-0039 step 6 moves the
      # SOURCE here and the 40-file gap closes — restore an upload step
      # that does view-or-create then `gh release upload --clobber`, with
      # `--repo` so gh never consults git (this job runs as root in a
      # tree chowned to the build user, and root's git refuses it for
      # "dubious ownership"). desktop.yml attaches the shell to the same
      # release and takes most of an hour to this job's seconds, so
      # neither side may assume it is the one creating the release.
      - name: Say what a tag does and does not publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Tag ${GITHUB_REF_NAME}: these packages are BUILT and TESTED but"
          echo "not attached to the release, so they stay out of the [lisa]"
          echo "index (lisa-os ADR-0057). desktop.yml attaches the shell."
          ls -l out/
