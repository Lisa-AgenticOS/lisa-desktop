# Drop-in for gnome-session@lisa.target — the systemd instance
# `gnome-session --session=lisa` starts. Same two Requires= as
# gnome-shell's gnome-session@gnome.target.d/gnome.session.conf, with
# the shell unit swapped for ours. This one file is what makes the
# session run Lisa Desktop instead of GNOME Shell.
[Unit]
Requires=gnome-session-services.target
Requires=lisa-desktop@user.service
